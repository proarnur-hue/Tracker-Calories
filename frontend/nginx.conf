server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend недоступен напрямую с фронтенд-домена в проде — тот же
    # /api-префикс, что и в dev-прокси vite.config.ts, только средствами nginx.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    # SPA-роутинг: прямой переход/обновление на /diary, /profile и т.д.
    # должен отдавать index.html, а не 404 от nginx.
    location / {
        try_files $uri /index.html;
    }
}
